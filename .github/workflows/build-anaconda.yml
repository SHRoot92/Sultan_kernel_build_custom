name: Matrix Build Anaconda

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: write

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master
  GCC_VERSION: "14.2.rel1"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: gs201
            pretty_name: Pixel 7
            ak3_branch: sultan-gs201
            defconfig: gs201_defconfig
            defconfig_path: arch/arm64/configs/gs201_defconfig
            dtb_path: google-devices/gs201/dts
            zip_prefix: Sultan-gs201
            artifact_name: gs201-kernel

          - device: zuma
            pretty_name: Pixel 8
            ak3_branch: sultan-zuma
            defconfig: zuma_defconfig
            defconfig_path: arch/arm64/configs/zuma_defconfig
            dtb_path: google-devices/zuma/dts
            zip_prefix: Sultan-zuma
            artifact_name: zuma-kernel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GCC
        run: |
          set -euo pipefail

          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.GCC_VERSION }}/binrel/"
          ARCHIVE="arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"

          wget -q "${BASE_URL}/${ARCHIVE}" -O gcc.tar.xz
          tar -xf gcc.tar.xz

          echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

      - name: Clone source and dependencies
        run: |
          set -euo pipefail

          git clone --depth=1 https://github.com/yapixel/anaconda_kernel_google_tensynos -b qpr2-stable sultan

          cd sultan
          git submodule update --init --recursive
          cd ..

          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b "${{ matrix.ak3_branch }}" AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Apply build-reproducibility patches
        working-directory: sultan
        run: |
          set -euo pipefail

          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )

          for p in "${PATCHES[@]}"; do
            if [ -f "$p" ]; then
              patch -p1 < "$p"
            else
              echo "Optional patch $p skipped."
            fi
          done

      - name: Collect build metadata
        id: meta
        run: |
          set -euo pipefail

          S_TAG=$(git -C sultan rev-parse --short HEAD)

          chmod +x sh/get_ksuver.sh || true
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "integrated")

          SU_VER=$(grep -m1 'define SUSFS_VERSION' sultan/include/linux/susfs.h | grep -oP '".*?"' | tr -d '"' || echo "integrated")

          G_VER=$(${{ env.TOOLCHAIN_PATH }}gcc --version | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "${{ env.GCC_VERSION }}")

          echo "--- LOGGING METADATA ---"
          echo "device: ${{ matrix.device }}"
          echo "pretty_name: ${{ matrix.pretty_name }}"
          echo "sultan_commit: $S_TAG"
          echo "ksu_version: $K_VER"
          echo "susfs_version: $SU_VER"
          echo "gcc_version: $G_VER"
          echo "------------------------"

          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_ver=${K_VER}" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=${SU_VER}" >> "$GITHUB_OUTPUT"
          echo "gcc_ver=${G_VER}" >> "$GITHUB_OUTPUT"

      - name: Integrate xxKSU Submodule
        run: |
          set -euo pipefail

          cd sultan

          if [ -d "drivers" ]; then
            DRIVER_DIR="drivers"
          else
            DRIVER_DIR="common/drivers"
          fi

          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"

          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"

          grep -q "source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"

      - name: Setup atp4pixel Config Pillars
        run: |
          set -euo pipefail

          cd sultan

          DEFCONFIG="${{ matrix.defconfig_path }}"

          echo "" >> "$DEFCONFIG"

          cat <<EOF >> "$DEFCONFIG"
          # KernelSU Core Source Integrated
          CONFIG_KSU=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_DEBUG is not set
          # CONFIG_KSU_ALLOWLIST_WORKAROUND is not set

          # SUSFS Stealth Pillars Optimized for Kernel 6.1
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set

          # Networking and System Pillars
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_INODE64=y
          EOF

          sed -i 's/CONFIG_TCP_CONG_BIC=y/CONFIG_TCP_CONG_BIC=n/' "$DEFCONFIG"
          sed -i 's/CONFIG_TCP_CONG_WESTWOOD=y/CONFIG_TCP_CONG_WESTWOOD=n/' "$DEFCONFIG"
          sed -i 's/CONFIG_TCP_CONG_HTCP=y/CONFIG_TCP_CONG_HTCP=n/' "$DEFCONFIG"
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$DEFCONFIG"
          sed -i '/CONFIG_KPROBES/d' "$DEFCONFIG"

          echo "# CONFIG_KPROBES is not set" >> "$DEFCONFIG"
          echo "CONFIG_WERROR=n" >> "$DEFCONFIG"

      - name: Build Kernel Production
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          set -euo pipefail

          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" ${{ matrix.defconfig }}
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"

      - name: Package AnyKernel3
        id: package
        run: |
          set -euo pipefail

          if [ -f sultan/out/arch/arm64/boot/Image.lz4 ]; then
            cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          else
            cp sultan/out/arch/arm64/boot/Image AK3/Image
          fi

          cat sultan/out/${{ matrix.dtb_path }}/*.dtb > AK3/dtb

          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          SU_VER="${{ steps.meta.outputs.susfs_ver }}"

          ZIP_NAME="${{ matrix.zip_prefix }}-${S_TAG}-xxKSU-r${K_VER}-SUSFS-${SU_VER}.zip"

          ( cd AK3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*" )

          echo "ZIP_PATH=$GITHUB_WORKSPACE/${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ env.ZIP_PATH }}

  release:
    needs: build
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure release-anchor branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if git ls-remote --exit-code --heads origin release-anchor >/dev/null 2>&1; then
            echo "release-anchor branch already exists."
            exit 0
          fi

          echo "Creating release-anchor branch..."

          CURRENT_SHA="$(git rev-parse HEAD)"

          git checkout --orphan release-anchor
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          git commit --allow-empty -m "chore: create release anchor"
          git push origin HEAD:release-anchor

          git checkout "$CURRENT_SHA"

      - name: Download kernel artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts debug
        run: |
          set -euo pipefail

          echo "=== artifacts directory contents ==="
          find ./artifacts -type f -maxdepth 3 -print

      - name: Create Release using release-anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          shopt -s nullglob
          ZIP_FILES=(artifacts/*.zip)

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "No ZIP files found in artifacts."
            exit 1
          fi

          echo "Found ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          NOTES_FILE="release_notes.md"

          cat > "$NOTES_FILE" <<EOF
          ### 🚀 Build Information

          | Device | Kernel Base | Manager | xxKSU Ver | SUSFS Ver | Compiler | ZIP |
          | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
          EOF

          for zip in "${ZIP_FILES[@]}"; do
            ZIP_NAME="$(basename "$zip")"

            DEVICE="unknown"
            PRETTY_NAME="Unknown"
            S_TAG="unknown"
            K_VER="unknown"
            SU_VER="unknown"

            if [[ "$ZIP_NAME" =~ ^Sultan-([^-]+)-([^-]+)-xxKSU-r([^-]+)-SUSFS-(.+)\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]}"
              S_TAG="${BASH_REMATCH[2]}"
              K_VER="${BASH_REMATCH[3]}"
              SU_VER="${BASH_REMATCH[4]}"

              case "$DEVICE" in
                gs201)
                  PRETTY_NAME="Pixel 7"
                  ;;
                zuma)
                  PRETTY_NAME="Pixel 8"
                  ;;
              esac
            fi

            echo "| **${PRETTY_NAME} (${DEVICE})** | Sultan (${S_TAG}) | [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU) | \`r${K_VER}\` | \`${SU_VER}\` | GCC ${{ env.GCC_VERSION }} | \`${ZIP_NAME}\` |" >> "$NOTES_FILE"
          done

          cat >> "$NOTES_FILE" <<EOF

          ### 🛠️ Networking Features Fortress

          - **TCP Congestion:** BBR v1 + FQ
          - **Routing:** Policy Routing Table 1066 + IPSet 64k
          - **Fixes:** ADDRTYPE Match, Google VPN XFRM, TTL 64 Share

          > Built for Pixel 7 gs201 and Pixel 8 zuma.
          > Download the attached kernel ZIP files. GitHub auto-generated source archives are not used for this build.
          EOF

          echo "Generated release notes:"
          cat "$NOTES_FILE"

          DATE=$(date +"%Y.%m.%d")
          TAG=""

          for attempt in $(seq 1 20); do
            git fetch --tags --force

            MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
            REV=$(( ${MAX_REV:-0} + 1 ))
            TAG="${DATE}-r${REV}"

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists. Retrying..."
              TAG=""
              sleep 2
              continue
            fi

            echo "Using tag: $TAG"
            break
          done

          if [ -z "$TAG" ]; then
            echo "Failed to generate unique tag."
            exit 1
          fi

          gh release create "$TAG" "${ZIP_FILES[@]}" \
            --target release-anchor \
            --title "Kernel Build — $TAG" \
            --notes-file "$NOTES_FILE"

          echo "Release created successfully: $TAG"
